<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>

<body>
    <h1>HTML Forms</h1>
    <form action="/action">
        <div>
            <label for="username">Username</label>
            <input type="text" name="" id="username">
        </div>

        <div>
            <label for="password">password</label>
            <input type="text" name="" id="password">
        </div>

        <div>
            <label for="age">Enter Age</label>
            <input type="number" name="" id="age" placeholder="age">
        </div>

        <button>Submit</button>
        <button type="reset">reset</button>

        <br>
        <input type="button" name="" id="" value="click me">
        <input type="submit" name="" id="">
    </form>
    <hr>
    <br>
    <form action="https://www.google.com/search">
        <input type="text" id="" name="q" placeholder="search on google">
        <button>submit</button>
    </form>

    <!-- checkbox -->
     <form action="">
        <input type="checkbox" name="age" id="age" checked>
        <label for="age">I am 20's</label>
        <br>
        <input type="radio" name="gender" id="gender">
        <label for="gender">male</label>

        <select name="profession" id="profession">
            <option >Select yout profession</option>
            <option value="student">Student</option>
            <option value="dev">Developer</option>
        </select>

        <br>
        <label for="volume">Volume</label>
        <input type="range" id="volume" max="100" min="10" name="val" value="50" step="5">
        <br>
        <label for="feedback">Please give your valuable feedback</label>
        <textarea name="feedback" id="feedback" rows="5" cols="40" placeholder="">Write Something</textarea>
     </form>
     <hr>
     <!-- Practice Qs.9 -->
     <h1>Registration Form</h1>
      <form action="/actions">
        <div>
            <input type="text" name="fname" id="fname" placeholder="First Name">
            <input type="text" name="lname" id="lname" placeholder="Last Name">
        </div>
        <div>
            <label for="gender">Please select gender </label>
            <select name="gender" id="gender">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Others">Others</option>
            </select>
        </div>
        <div>
            Do you agree to all terms of service?
            <input type="checkbox" name="agree" id="">
            <label for="check">Yes. I agree</label>
        </div>

        <button>Register</button>
      </form>
      <hr><br>
      <!-- Practice Qs.11 -->
      <form action="">
        <div>
            <label for="name">Name: </label>
            <input type="text" name="name" id="name">
        </div>

        <div>
            Sex:
            <input type="radio" name="sex" id="sex" value="Male">
            <label for="m">Male</label>
            <input type="radio" name="sex" id="sex" value="Female">
            <label for="f">Female</label>
        </div>

        <div>
            Country: 
            <select name="country" id="country">
                <option>Select an option</option>
                <option value="India">India</option>
                <option value="USA">USA</option>
                <option value="UK">UK</option>
                <option value="Rassia">Rassia</option>
            </select>
        </div>

        <div>
            Message: <br/>
            <textarea name="Message" id="mess" cols="30" rows="5"></textarea>
        </div>
        <div>
            <input type="checkbox" name="sub" id="sub">
            <label for="sub">Subscribe?</label>
        </div>
        <button>Submit</button>
      </form>
</body>

</html>
